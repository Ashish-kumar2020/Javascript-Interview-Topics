<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="parent">
      <div id="child1">First</div>

      <div id="child2">Second</div>

      <div id="child3">Third</div>
    </div>

    <script>
      function previousLeftSibling(target) {
        if (!target) {
          return null;
        }
        return target.previousElementSibling;
      }

      const child1 = document.getElementById("child1");

      const child2 = document.getElementById("child2");

      const child3 = document.getElementById("child3");

      console.log(previousLeftSibling(child3)); 

      console.log(previousLeftSibling(child2)); 

      console.log(previousLeftSibling(child1)); 

      console.log(previousLeftSibling(null)); 
    </script>
  </body>
</html>
